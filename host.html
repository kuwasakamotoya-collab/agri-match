<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>農業マッチング登録 - 農園・農作業の募集</title>
<style>
  :root {
    --green-dark: #2e7d32;
    --green-mid: #4caf50;
    --brown: #8d6e46;
    --cream: #faf6ee;
    --text: #333333;
    --border: #d9d0bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--cream);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    background: var(--brown);
    color: #fff;
    padding: 24px 16px 20px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.3rem;
  }
  header p {
    margin: 0;
    font-size: 0.85rem;
    opacity: 0.9;
  }
  form {
    max-width: 480px;
    margin: 20px auto;
    padding: 0 16px;
  }
  .section {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .section h2 {
    font-size: 1rem;
    color: var(--brown);
    margin: 0 0 12px;
    border-bottom: 2px solid var(--brown);
    padding-bottom: 6px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: bold;
    margin: 12px 0 4px;
  }
  label.required::after {
    content: " *必須";
    color: #c0392b;
    font-weight: normal;
    font-size: 0.75rem;
  }
  input[type="text"],
  input[type="number"],
  input[type="tel"],
  input[type="email"],
  select,
  textarea {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 70px; }
  .checkbox-group, .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .checkbox-group label, .radio-group label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: normal;
    font-size: 0.9rem;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 14px;
    margin: 0;
    cursor: pointer;
  }
  .checkbox-group input, .radio-group input {
    width: auto;
    accent-color: var(--brown);
  }
  .hint {
    font-size: 0.75rem;
    color: #777;
    margin-top: 4px;
  }
  button[type="submit"] {
    width: 100%;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: bold;
    color: #fff;
    background: var(--brown);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button[type="submit"]:active { background: #6f5636; }
  button[type="submit"]:disabled { background: #aaa; }
  #statusMsg {
    max-width: 480px;
    margin: 0 auto 16px;
    padding: 0 16px;
    text-align: center;
    font-size: 0.9rem;
  }
  #statusMsg.success { color: var(--green-dark); font-weight: bold; }
  #statusMsg.error { color: #c0392b; font-weight: bold; }
  #successBox {
    display: none;
    max-width: 480px;
    margin: 20px auto;
    padding: 24px 16px;
    text-align: center;
  }
  #successBox h2 { color: var(--brown); }
</style>
</head>
<body>

<header>
  <h1>🌱 農作業を募集する方の登録</h1>
  <p>あなたの農園の情報を登録すると、参加希望者をご紹介します</p>
</header>

<div id="statusMsg"></div>

<form id="hostForm">

  <div class="section">
    <h2>基本情報</h2>

    <label class="required" for="hostName">農園名・お名前</label>
    <input type="text" id="hostName" name="hostName" required placeholder="例：坂本農園">

    <label class="required" for="location">所在地（市区町村まで）</label>
    <input type="text" id="location" name="location" required placeholder="例：岐阜県土岐市">

    <label class="required" for="contact">連絡先（電話番号）</label>
    <input type="tel" id="contact" name="contact" required placeholder="例：0572-XX-XXXX">

    <label for="contactEmail">メールアドレス</label>
    <input type="email" id="contactEmail" name="contactEmail" placeholder="例：sakamoto@example.com">
    <p class="hint">入力いただくと、マッチング成立時の連絡がスムーズです（任意）</p>
  </div>

  <div class="section">
    <h2>募集する農作業</h2>

    <label class="required">募集作業内容（複数選択可）</label>
    <div class="checkbox-group" id="workTypeGroup">
      <label><input type="checkbox" name="workType" value="稲作">稲作</label>
      <label><input type="checkbox" name="workType" value="野菜栽培">野菜栽培</label>
      <label><input type="checkbox" name="workType" value="果樹">果樹</label>
      <label><input type="checkbox" name="workType" value="畜産">畜産</label>
      <label><input type="checkbox" name="workType" value="開墾・農地整備">開墾・農地整備</label>
      <label><input type="checkbox" name="workType" value="その他">その他</label>
    </div>

    <label class="required" for="capacity">募集人数</label>
    <input type="number" id="capacity" name="capacity" required min="1" placeholder="例：2">

    <label class="required">求める経験レベル</label>
    <div class="radio-group" id="expGroup">
      <label><input type="radio" name="expRequired" value="未経験OK" required checked>未経験OK</label>
      <label><input type="radio" name="expRequired" value="1年以上">1年以上</label>
      <label><input type="radio" name="expRequired" value="経験者希望">経験者希望</label>
    </div>
  </div>

  <div class="section">
    <h2>募集時期・条件</h2>

    <label class="required">募集時期（複数選択可）</label>
    <div class="checkbox-group" id="seasonGroup">
      <label><input type="checkbox" name="season" value="通年">通年</label>
      <label><input type="checkbox" name="season" value="春">春</label>
      <label><input type="checkbox" name="season" value="夏">夏</label>
      <label><input type="checkbox" name="season" value="秋">秋</label>
      <label><input type="checkbox" name="season" value="冬">冬</label>
    </div>

    <label for="frequency">曜日・頻度</label>
    <input type="text" id="frequency" name="frequency" placeholder="例：土日・月2回程度">

    <label for="reward">報酬・条件</label>
    <input type="text" id="reward" name="reward" placeholder="例：無償、収穫物分配あり、日当ありなど">
  </div>

  <div class="section">
    <h2>その他</h2>
    <label for="freeText">自由記述（農園の雰囲気や特色など）</label>
    <textarea id="freeText" name="freeText" placeholder="農園の様子や、参加者に伝えたいことを自由にお書きください"></textarea>
  </div>

  <button type="submit" id="submitBtn">登録する</button>
</form>

<div id="successBox">
  <h2>✅ 登録が完了しました</h2>
  <p>ご登録ありがとうございます。<br>条件に合う参加希望者が見つかりましたら、ご連絡いたします。</p>
</div>

<script>
  // register.htmlと同じGASウェブアプリURLを使用します
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxCFWBwmlTB65fMqJVwBx8rybYgZj2iG3yE1cWvfo4SXJKQk2iCkvxmP0botw-b0f9u/exec";

  const form = document.getElementById('hostForm');
  const statusMsg = document.getElementById('statusMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const workTypes = [...form.querySelectorAll('input[name="workType"]:checked')].map(el => el.value);
    if (workTypes.length === 0) {
      statusMsg.textContent = '「募集作業内容」を1つ以上選択してください';
      statusMsg.className = 'error';
      window.scrollTo(0, 0);
      return;
    }
    const seasons = [...form.querySelectorAll('input[name="season"]:checked')].map(el => el.value);
    if (seasons.length === 0) {
      statusMsg.textContent = '「募集時期」を1つ以上選択してください';
      statusMsg.className = 'error';
      window.scrollTo(0, 0);
      return;
    }

    const data = {
      formType: "host",
      hostName: form.hostName.value.trim(),
      location: form.location.value.trim(),
      contact: form.contact.value.trim(),
      contactEmail: form.contactEmail.value.trim(),
      workType: workTypes.join(','),
      capacity: form.capacity.value,
      expRequired: form.expRequired.value,
      season: seasons.join(','),
      frequency: form.frequency.value.trim(),
      reward: form.reward.value.trim(),
      freeText: form.freeText.value.trim()
    };

    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';
    statusMsg.textContent = '';

    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'text/plain' }
    })
      .then(res => res.json())
      .then(result => {
        if (result.result === 'success') {
          form.style.display = 'none';
          document.getElementById('successBox').style.display = 'block';
          window.scrollTo(0, 0);
        } else {
          throw new Error(result.message || '登録に失敗しました');
        }
      })
      .catch(err => {
        statusMsg.textContent = '送信エラー：時間をおいて再度お試しください（' + err.message + '）';
        statusMsg.className = 'error';
        submitBtn.disabled = false;
        submitBtn.textContent = '登録する';
        window.scrollTo(0, 0);
      });
  });
</script>

</body>
</html>
